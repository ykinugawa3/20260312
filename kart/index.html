<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ドットカート グランプリ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one 16:9 arcade screen, centered on a dark cabinet; menus and HUD float over the canvas. */
:root{
  --cab:#0d0b1f;        /* cabinet black-violet */
  --panel:#1b1740;      /* menu panel */
  --ink:#fdf8e6;        /* warm white text */
  --gold:#ffcf2e;       /* trophy / highlight */
  --red:#ff4a3d;        /* signal red */
  --cyan:#45d4ff;       /* accent */
  --muted:#a9a3cf;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--cab);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
#wrap{position:relative;width:min(100%,calc((100dvh - 16px)*16/9));aspect-ratio:16/9;max-width:100%;container-type:inline-size;
  box-shadow:0 0 0 3px #2c2760,0 0 40px #000;border-radius:6px;overflow:hidden;background:#000}
#screen{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:.25cqw .25cqw 0 #000,-.15cqw -.15cqw 0 #000}
#hudLap{position:absolute;left:2.5cqw;top:2cqw;font-size:3.4cqw;line-height:1}
#hudLap b{font-size:4.6cqw;color:var(--gold)}
#hudTime{position:absolute;left:2.5cqw;top:7.6cqw;font-size:2.8cqw;font-variant-numeric:tabular-nums}
#hudLaps{position:absolute;left:2.5cqw;top:11cqw;font-size:1.9cqw;color:var(--muted);line-height:1.35;font-variant-numeric:tabular-nums}
#itemBox{position:absolute;left:50%;top:1.6cqw;transform:translateX(-50%);width:9cqw;height:9cqw;border:.5cqw solid #fff;border-radius:1.2cqw;
  background:rgba(20,16,60,.55);box-shadow:0 0 0 .3cqw #000}
#itemSlot{width:100%;height:100%;image-rendering:pixelated}
#hudRank{position:absolute;right:2.5cqw;top:1cqw;font-size:9cqw;line-height:1;color:var(--gold)}
#hudRank small{font-size:3.6cqw}
#hudCoins{position:absolute;left:2.5cqw;bottom:2cqw;font-size:3.2cqw;display:flex;align-items:center;gap:.8cqw}
#hudCoins i{display:inline-block;width:2.8cqw;height:3.4cqw;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6b0,#ffc61a 45%,#c98a00);box-shadow:0 0 0 .25cqw #000}
#mini{position:absolute;right:2cqw;bottom:2cqw;width:20cqw;height:20cqw;image-rendering:pixelated;opacity:.92}
#msg{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:7cqw;letter-spacing:.3cqw;color:var(--gold);
  text-shadow:.4cqw .4cqw 0 #c0230f,-.2cqw -.2cqw 0 #000,.6cqw .6cqw 0 #000}
#msg small{display:block;font-size:3cqw;color:var(--ink);text-shadow:.2cqw .2cqw 0 #000;margin-top:1cqw}
#signal{position:absolute;left:50%;top:13cqw;transform:translateX(-50%);display:flex;gap:1cqw;padding:1cqw 1.4cqw;background:#222;border:.4cqw solid #000;border-radius:2cqw}
#signal span{width:5cqw;height:5cqw;border-radius:50%;background:#3b1210;box-shadow:inset 0 0 0 .3cqw #000}
#signal span.on{background:var(--red);box-shadow:0 0 2cqw var(--red)}
#signal span.go{background:#3dff6e;box-shadow:0 0 2cqw #3dff6e}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;
  background:linear-gradient(180deg,rgba(13,11,31,.25),rgba(13,11,31,.75));padding:2cqw 3cqw;box-sizing:border-box;text-align:center}
.overlay.dim{background:rgba(13,11,31,.82)}
.logo{font-size:8.5cqw;line-height:1.05;color:var(--gold);letter-spacing:.4cqw;
  text-shadow:.5cqw .5cqw 0 #d2321e,1cqw 1cqw 0 #000;transform:rotate(-3deg);margin:0}
.logo small{display:block;font-size:4.2cqw;color:var(--cyan);text-shadow:.3cqw .3cqw 0 #12306e,.6cqw .6cqw 0 #000;letter-spacing:1.2cqw}
.blink{animation:blink 1s steps(2) infinite;font-size:3cqw}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
h2{margin:0;font-size:4.4cqw;font-weight:normal;color:var(--gold);text-shadow:.3cqw .3cqw 0 #000}
.row{display:flex;flex-wrap:wrap;gap:1.6cqw;justify-content:center}
.opt{font:inherit;color:var(--ink);background:var(--panel);border:.4cqw solid #4b4394;border-radius:1.2cqw;padding:1.2cqw 2.6cqw;font-size:3cqw;cursor:pointer;
  box-shadow:0 .6cqw 0 #000;min-width:16cqw}
.opt:hover,.opt:focus-visible{outline:none;border-color:var(--gold);color:var(--gold);transform:translateY(-.3cqw)}
.opt small{display:block;font-size:1.8cqw;color:var(--muted);margin-top:.4cqw}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2cqw;width:84cqw}
.chars .opt{min-width:0;padding:.5cqw .6cqw;font-size:2.1cqw}
.chars .opt small{margin-top:0}
.chars canvas{width:100%;aspect-ratio:2/1;image-rendering:pixelated;display:block}
.stats{display:grid;grid-template-columns:auto 1fr;gap:0 .8cqw;font-size:1.35cqw;line-height:1.25;text-align:left;color:var(--muted);margin-top:.4cqw}
.stats b{display:block;height:1cqw;background:linear-gradient(90deg,var(--cyan) var(--v),#2a2556 var(--v));align-self:center;border-radius:.3cqw}
.courses{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw;width:90cqw}
.courses .opt{min-width:0;padding:.8cqw;font-size:2.1cqw}
.courses canvas{width:100%;aspect-ratio:1;display:block;image-rendering:pixelated;border-radius:.6cqw}
.help{font-size:1.9cqw;color:var(--muted);line-height:1.6}
.help kbd{font:inherit;color:var(--ink);background:#2a2556;border-radius:.4cqw;padding:0 .6cqw}
table.res{border-collapse:collapse;font-size:2.4cqw;font-variant-numeric:tabular-nums;background:rgba(27,23,64,.85);border:.4cqw solid #4b4394}
table.res td,table.res th{padding:.35cqw 1.6cqw;text-align:left;font-weight:normal}
table.res th{color:var(--muted);font-size:1.8cqw}
table.res tr.me td{color:var(--gold)}
table.res td.n{text-align:right}
.dot{display:inline-block;width:1.6cqw;height:1.6cqw;border-radius:50%;margin-right:.8cqw;vertical-align:middle;box-shadow:0 0 0 .2cqw #000}
.trophy{font-size:4cqw;color:var(--gold)}

#touch{display:none;width:100%;max-width:100%;gap:10px;justify-content:space-between;align-items:flex-end;pointer-events:none}
body.touch #touch{display:flex}
#touch .grp{display:flex;gap:6px;pointer-events:auto}
#touch button{font:inherit;color:var(--ink);background:rgba(43,38,96,.85);border:2px solid #6c63c8;border-radius:50%;width:62px;height:62px;font-size:15px;touch-action:none;padding:0}
#touch button.on{background:var(--gold);color:#000}
#touch button.wide{border-radius:16px;width:68px;font-size:13px}
@media (orientation:landscape){
  body.touch #touch{position:fixed;left:0;right:0;bottom:0;box-sizing:border-box;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  body.touch #touch button{background:rgba(43,38,96,.45)}
}
#muteBtn{position:absolute;right:1cqw;top:1cqw;font:inherit;font-size:1.8cqw;color:var(--muted);background:rgba(0,0,0,.4);border:0;border-radius:.6cqw;padding:.4cqw .8cqw;cursor:pointer;z-index:5}
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="screen" width="384" height="216"></canvas>
    <div id="hud" hidden>
      <div id="hudLap">LAP <b id="lapN">1</b>/3</div>
      <div id="hudTime">0'00"00</div>
      <div id="hudLaps"></div>
      <div id="itemBox"><canvas id="itemSlot" width="48" height="48"></canvas></div>
      <div id="hudRank">8<small>th</small></div>
      <div id="hudCoins"><i></i><span id="coinN">×0</span></div>
      <canvas id="mini" width="128" height="128"></canvas>
      <div id="signal" hidden><span></span><span></span><span></span></div>
      <div id="msg"></div>
    </div>
    <div id="menu" class="overlay"></div>
    <button id="muteBtn" type="button">♪ ON</button>
  </div>
  <div id="touch">
    <div class="grp">
      <button id="tL" type="button">◀</button>
      <button id="tR" type="button">▶</button>
    </div>
    <div class="grp">
      <button id="tB" type="button" class="wide">ブレーキ</button>
      <button id="tD" type="button" class="wide">ドリフト</button>
      <button id="tI" type="button" class="wide">アイテム</button>
    </div>
  </div>
</div>
<script>
'use strict';
// ============================================================
//  ドットカート グランプリ — 擬似3D(モード7風)カートレース
// ============================================================
const W = 384, H = 216, HOR = 66, FOCAL = 250;
const MAP = 2048, MASK = MAP - 1;
const ROAD = 140, OFF = 120, STEP = 8;
const CAM_DIST = 96, CAM_H = 40;
const FOV = 2 * Math.atan((W / 2) / FOCAL);
const BGW = Math.round(W * 2 * Math.PI / FOV);
const LAPS = 3;
const KR = 12; // kart collision radius
const PITCH_S = 0.36, PITCH_C = 0.93;
const POINTS = [9, 6, 3, 1, 0, 0, 0, 0];
const CC = [{ name: '50cc', base: 230 }, { name: '100cc', base: 270 }, { name: '150cc', base: 310 }];

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(h, f) { const [r, g, b] = hexRGB(h); return `rgb(${clamp(r * f | 0, 0, 255)},${clamp(g * f | 0, 0, 255)},${clamp(b * f | 0, 0, 255)})`; }
function rankStr(r) { return r === 1 ? 'st' : r === 2 ? 'nd' : r === 3 ? 'rd' : 'th'; }
function fmtTime(t) { if (!isFinite(t)) return "-'--\"--"; const m = Math.floor(t / 60), s = Math.floor(t % 60), c = Math.floor((t * 100) % 100); return `${m}'${String(s).padStart(2, '0')}"${String(c).padStart(2, '0')}`; }
const store = {
  get(k) { try { return localStorage.getItem('dotkart.' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('dotkart.' + k, v); } catch (e) { } }
};

// ---------------- キャラクター ----------------
const CLASSES = {
  light: { label: '軽量級', top: 0.95, acc: 1.3, hand: 1.12, wt: 0.8 },
  mid: { label: 'バランス', top: 1.0, acc: 1.0, hand: 1.0, wt: 1.0 },
  heavy: { label: '重量級', top: 1.05, acc: 0.78, hand: 0.9, wt: 1.4 },
  tech: { label: 'テクニック', top: 0.97, acc: 1.08, hand: 1.3, wt: 0.9 },
};
const CHARS = [
  { name: 'ミケ', animal: 'ネコ', body: '#e5413a', face: '#f6c48c', ear: 'cat', cls: 'light' },
  { name: 'ポチ', animal: 'イヌ', body: '#3a6fe5', face: '#d9a066', ear: 'dog', cls: 'mid' },
  { name: 'ミミ', animal: 'ウサギ', body: '#ef6fb0', face: '#f7f0f2', ear: 'rabbit', cls: 'light' },
  { name: 'ケロ', animal: 'カエル', body: '#3fb34f', face: '#86d95e', ear: 'frog', cls: 'tech' },
  { name: 'ゴン', animal: 'クマ', body: '#f08c24', face: '#8a5a35', ear: 'bear', cls: 'heavy' },
  { name: 'ペン', animal: 'ペンギン', body: '#1fb8d6', face: '#2a2f45', ear: 'penguin', cls: 'tech' },
  { name: 'コン', animal: 'キツネ', body: '#f2c230', face: '#f08a2c', ear: 'fox', cls: 'mid' },
  { name: 'ブー', animal: 'ブタ', body: '#8b55d6', face: '#f6a8b8', ear: 'pig', cls: 'heavy' },
];
CHARS.forEach((c, i) => { c.id = i; c.st = CLASSES[c.cls]; c.bodyD = shade(c.body, 0.62); c.bodyM = shade(c.body, 0.8); c.faceD = shade(c.face, 0.75); });

// ---------------- コース ----------------
const COURSES = [
  { name: 'クローバー サーキット', edge: 'wall', start: [850, 1745], offSlow: 0.45, offGrip: 1, music: 0,
    pts: [[400, 1700], [1000, 1760], [1600, 1720], [1780, 1450], [1560, 1200], [1700, 900], [1760, 500], [1500, 320], [1150, 420], [980, 720], [720, 640], [580, 420], [460, 300], [320, 400], [300, 700], [480, 1000], [320, 1300]],
    pads: [0.43, 0.86],
    th: { sky: ['#3f8ff0', '#c4e8ff'], fog: '#d4ecff', bg: 'hills', far: '#6f9fd0', near: '#3c9a47', wall: 'bush', fence: '#f1ede0', off: ['#5cb247', '#53a83f'], road: '#8a8a93', curb: ['#e43c3c', '#f6f6f6'], dust: '#6fbf52', mini: '#53a83f', miniRoad: '#d8d8de' } },
  { name: 'サンセット デザート', edge: 'wall', start: [300, 1050], offSlow: 0.5, offGrip: 1, music: -3,
    pts: [[300, 1200], [300, 900], [500, 500], [900, 350], [1300, 450], [1450, 800], [1180, 1060], [1330, 1350], [1650, 1260], [1800, 1550], [1550, 1800], [1000, 1750], [600, 1800], [300, 1500]],
    pads: [0.3, 0.7],
    th: { sky: ['#ff6e4a', '#ffd79a'], fog: '#ffd9a8', bg: 'mesa', far: '#c25a3c', near: '#e6a157', wall: 'rock', fence: '#6e3a1e', off: ['#e2b66c', '#d8aa5e'], road: '#a46b3e', curb: ['#d24a2a', '#fff2d2'], dust: '#e8c07a', mini: '#d8aa5e', miniRoad: '#7a4626' } },
  { name: 'フロスト レイク', edge: 'wall', start: [800, 300], offSlow: 0.72, offGrip: 0.18, music: 2,
    pts: [[300, 300], [1700, 300], [1750, 700], [1300, 800], [700, 750], [500, 950], [700, 1150], [1400, 1100], [1750, 1300], [1700, 1700], [1000, 1750], [350, 1700], [250, 1000]],
    pads: [0.18, 0.62],
    th: { sky: ['#8fbbe8', '#eef6ff'], fog: '#eef6ff', bg: 'snow', far: '#a7bcd6', near: '#2f5c4c', wall: 'water', fence: '#ffffff', off: ['#eef6ff', '#dae8f7'], road: '#7889a3', curb: ['#2d63c8', '#ffffff'], dust: '#ffffff', mini: '#dae8f7', miniRoad: '#5a6b85' } },
  { name: 'スターライト ロード', edge: 'void', start: [1200, 1790], offSlow: 1, offGrip: 1, music: 5,
    pts: [[1024, 1800], [1700, 1750], [1820, 1380], [1500, 1340], [1360, 1130], [1520, 900], [1760, 800], [1750, 400], [1300, 250], [1000, 600], [700, 250], [300, 350], [250, 800], [580, 930], [620, 1120], [320, 1320], [400, 1750]],
    pads: [0.25, 0.55, 0.85],
    th: { sky: ['#05051a', '#241360'], fog: '#3a1f80', bg: 'space', far: '#ff7ad9', near: '#5a3cc8', wall: 'space', fence: null, off: null, road: 'rainbow', curb: ['#ffffff', '#ffe95a'], dust: '#ffffff', mini: '#120c30', miniRoad: '#ff9ae6' } },
];

function catmull(P) {
  const n = P.length, out = [];
  for (let i = 0; i < n; i++) {
    const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
    for (let k = 0; k < 40; k++) {
      const t = k / 40, t2 = t * t, t3 = t2 * t;
      const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
      out.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
    }
  }
  return out;
}
function resample(pts, step) {
  const n = pts.length, cum = [0];
  for (let i = 1; i <= n; i++) { const a = pts[i - 1], b = pts[i % n]; cum.push(cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
  const L = cum[n], N = Math.floor(L / step), res = [];
  let j = 0;
  for (let s = 0; s < N; s++) {
    const d = s * L / N;
    while (cum[j + 1] < d) j++;
    const t = (d - cum[j]) / (cum[j + 1] - cum[j] || 1), a = pts[j], b = pts[(j + 1) % n];
    res.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
  }
  return { pts: res, L };
}
function smooth(p, iters, rad) {
  for (let it = 0; it < iters; it++) {
    const n = p.length, q = [];
    for (let i = 0; i < n; i++) {
      let x = 0, y = 0;
      for (let k = -rad; k <= rad; k++) { const r = p[(i + k + n) % n]; x += r[0]; y += r[1]; }
      q.push([x / (2 * rad + 1), y / (2 * rad + 1)]);
    }
    p = q;
  }
  return p;
}

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function patCheck(g, a, b, s) { const c = mkCanvas(s * 2, s * 2), x = c.getContext('2d'); x.fillStyle = a; x.fillRect(0, 0, s * 2, s * 2); x.fillStyle = b; x.fillRect(0, 0, s, s); x.fillRect(s, s, s, s); return g.createPattern(c, 'repeat'); }
function patNoise(g, base, amt, seed, size = 64) {
  const c = mkCanvas(size, size), x = c.getContext('2d'), R = rng(seed), [r, gg, b] = hexRGB(base);
  const id = x.createImageData(size, size);
  for (let i = 0; i < size * size; i++) { const v = (R() - 0.5) * amt; id.data[i * 4] = clamp(r + v, 0, 255); id.data[i * 4 + 1] = clamp(gg + v, 0, 255); id.data[i * 4 + 2] = clamp(b + v, 0, 255); id.data[i * 4 + 3] = 255; }
  x.putImageData(id, 0, 0);
  return g.createPattern(c, 'repeat');
}
function patWall(g, kind, seed) {
  const R = rng(seed), s = 96, c = mkCanvas(s, s), x = c.getContext('2d');
  const blobs = (base, cols, n, rmin, rmax) => {
    x.fillStyle = base; x.fillRect(0, 0, s, s);
    for (let i = 0; i < n; i++) {
      const px = R() * s, py = R() * s, r = rmin + R() * (rmax - rmin);
      x.fillStyle = cols[i % cols.length];
      for (const ox of [-s, 0, s]) for (const oy of [-s, 0, s]) { x.beginPath(); x.arc(px + ox, py + oy, r, 0, 7); x.fill(); }
    }
  };
  if (kind === 'bush') blobs('#255a22', ['#2f7a2b', '#3a8f33', '#1d4a1b', '#47a23d'], 40, 6, 14);
  else if (kind === 'rock') blobs('#8a4d2a', ['#9e5c35', '#76401f', '#b06a3e'], 30, 6, 16);
  else if (kind === 'water') {
    x.fillStyle = '#2e6bb0'; x.fillRect(0, 0, s, s); x.strokeStyle = '#4f8fd6'; x.lineWidth = 2;
    for (let i = 0; i < 9; i++) { const px = R() * s, py = R() * s; x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + 6, py - 4, px + 12, py); x.stroke(); }
  } else {
    x.fillStyle = '#05051a'; x.fillRect(0, 0, s, s);
    for (let i = 0; i < 14; i++) { x.fillStyle = R() < 0.3 ? '#fff' : R() < 0.5 ? '#a9a0ff' : '#5a52a8'; x.fillRect(R() * s | 0, R() * s | 0, R() < 0.2 ? 2 : 1, 1); }
  }
  return g.createPattern(c, 'repeat');
}

function makeBG(th, seed) {
  const c = mkCanvas(BGW, HOR + 1), g = c.getContext('2d'), R = rng(seed);

function startRace(ci, demo) {

  else if (G.mode === 'gp' && G.gpRace > 0) order.sort((a, b) => (G.gp[b] - G.gp[a]) || (a === G.pchar ? 1 : -1));

function updateIdx(k) {
  const C = G.C, N = C.N;
  let best = 1e18, bi = k.idx;
  for (let o = -15; o <= 30; o++) { const i = (k.idx + o + N) % N, dx = C.px[i] - k.x, dy = C.py[i] - k.y, d = dx * dx + dy * dy; if (d < best) { best = d; bi = i; } }
  if (best > 230 * 230) { for (let i = 0; i < N; i++) { const dx = C.px[i] - k.x, dy = C.py[i] - k.y, d = dx * dx + dy * dy; if (d < best) { best = d; bi = i; } } }

function pickItem(rank) {
  const tables = [
    [['banana', 45], ['green', 38], ['mushroom', 12], ['red', 5]],
    [['banana', 22], ['green', 26], ['red', 24], ['mushroom', 22], ['star', 6]],
    [['green', 12], ['red', 30], ['mushroom', 32], ['star', 26]],
  ];
  const tb = tables[rank <= 2 ? 0 : rank <= 5 ? 1 : 2];
  let r = Math.random() * tb.reduce((s, x) => s + x[1], 0);
  for (const [t, w] of tb) { if ((r -= w) <= 0) return t; }
  return 'banana';
}

function hitKart(k, src) {

  k.spin = 1.1; k.vel *= 0.35; k.drift = 0; k.charge = 0; k.boost = 0;
  if (k.isPlayer) { SFX.spin(); const lost = Math.min(k.coins, 2); k.coins -= lost; }
  return true;
}

function useItem(k) {
  const it = k.item; if (!it) return; k.item = null;
  const fx = Math.cos(k.ang), fy = Math.sin(k.ang), C = G.C;
  if (it === 'banana') { G.objs.push({ type: 'banana', x: k.x - fx * 26, y: k.y - fy * 26, life: 60 }); if (near(k)) SFX.drop(); }
  else if (it === 'green' || it === 'red') {
    let target = null;
    if (it === 'red') target = G.karts.find(o => o.rank === k.rank - 1 && !o.finished) || null;
    G.objs.push({ type: it, x: k.x + fx * 26, y: k.y + fy * 26, ang: k.ang, sp: Math.max(460, k.vel + 200), life: it === 'red' ? 9 : 6, owner: k, age: 0, idx: k.idx, target, bounces: 0 });

function aiInput(k) {
  const C = G.C, N = C.N, ai = k.ai;
  const look = 7 + Math.floor(Math.abs(k.vel) / 45);
  const i = (k.idx + look) % N;
  const lane = clamp(ai.lane + Math.sin(G.t * 0.35 + ai.phase) * 16, -48, 48);
  let tx = C.px[i] + C.nx[i] * lane, ty = C.py[i] + C.ny[i] * lane;
  // バナナ回避
  for (const o of G.objs) {
    if (o.type !== 'banana') continue; const dx = o.x - k.x, dy = o.y - k.y, d = Math.hypot(dx, dy);
    if (d < 110) { const f = dx * Math.cos(k.ang) + dy * Math.sin(k.ang); if (f > 0) { const side = -dx * Math.sin(k.ang) + dy * Math.cos(k.ang); const push = side > 0 ? -40 : 40; tx += C.nx[i] * push; ty += C.ny[i] * push; } }

    ai.itemT -= 1 / 60;
    if (ai.itemT <= 0) {
      let use = true;
      if (k.item === 'mushroom') use = Math.abs(diff) < 0.15 || Math.random() < 0.01;
      if (k.item === 'green') use = G.karts.some(o => o !== k && Math.hypot(o.x - k.x, o.y - k.y) < 320 && Math.abs(angDiff(Math.atan2(o.y - k.y, o.x - k.x), k.ang)) < 0.2) || Math.random() < 0.004;

function updateKart(k, inp, dt, prev) {
  const C = G.C, st = k.ch.st;

    k.fall -= dt; k.z -= 160 * dt; k.vel *= 0.95;

      const i = (k.idx - 4 + C.N) % C.N; k.x = C.px[i]; k.y = C.py[i]; k.ang = k.moveAng = C.ta[i]; k.vel = 0; k.z = 50; k.vz = 0; k.safe = 1.5; k.spin = 0; k.drift = 0;
    }

  }

  let maxS = CC[G.cc].base * st.top * (1 + 0.01 * k.coins);
  if (!k.isPlayer || G.state === 'finish') {
    let rb = 1;
    if (!G.demo && !k.isPlayer) { const d = (k.progress - G.player.progress) * C.sl; rb = clamp(1 - d / 9000, 0.93, 1.08); }

  if (k.spin > 0) {
    k.spin -= dt; k.spinRot += 13 * dt; k.vel *= (1 - 2.2 * dt);
    if (k.spin <= 0) k.spinRot = 0;
  } else {
    const ACC = 150 * st.acc;

      if (k.vel < maxS) k.vel += ACC * dt * (1.15 - 0.55 * clamp(k.vel / maxS, 0, 1));
      else k.vel -= (k.vel - maxS) * Math.min(1, 2.5 * dt);

    } else {

    }
    if (inp.brake && k.vel > 0 && inp.accel) k.vel -= 200 * dt;
    if (k.vel > maxS) k.vel -= (k.vel - maxS) * Math.min(1, 2.5 * dt);

    if (inp.drift && !prev.drift && k.z <= 0 && k.vel > 40) { k.vz = 95; k.air = true; if (k === G.player) SFX.hop(); }
    const TURN = 2.45 * st.hand, spdF = Math.min(1, Math.abs(k.vel) / 70);

      k.charge += dt * (0.85 + 0.7 * Math.max(0, s));
      if (k === G.player && k.charge > 0.8 && Math.random() < 0.25) SFX.spark();
      if (!inp.drift || k.vel < 70 || offroad && C.def.offSlow < 0.6) {
        if (k.charge >= 1.7) { k.boost = Math.max(k.boost, 0.9); k.boostLv = 2; if (k === G.player) SFX.boost(); }
        else if (k.charge >= 0.85) { k.boost = Math.max(k.boost, 0.5); k.boostLv = 1; if (k === G.player) SFX.boost(); }
        k.drift = 0; k.charge = 0;
      }
    } else turn = inp.steer * TURN * (1 - 0.22 * clamp(k.vel / 320, 0, 1));

    k.vz -= 420 * dt; k.z += k.vz * dt;
    if (k.z <= 0) {

      if (k.air && inp.drift && Math.abs(inp.steer) > 0.3 && k.vel > 110 && k.spin <= 0) { k.drift = Math.sign(inp.steer); k.charge = 0; }

  if (terrainAt(nx, ny) === 0 && C.def.edge === 'wall') {
    if (terrainAt(nx, k.y) !== 0) { k.x = nx; k.vel *= 0.93; }
    else if (terrainAt(k.x, ny) !== 0) { k.y = ny; k.vel *= 0.93; }
    else { k.vel = -k.vel * 0.35; if (k === G.player) SFX.bump(); }
    if (Math.abs(k.vel) > 150 && k === G.player && Math.random() < 0.1) SFX.bump();
  } else { k.x = nx; k.y = ny; }
  if (C.def.edge === 'void' && k.z <= 0 && terrainAt(k.x, k.y) === 0) { k.fall = 1.3; k.drift = 0; k.boost = 0; if (k === G.player) SFX.fall(); }
  // パーティクル
  if (near(k) && Math.random() < 0.6) {
    if (k.drift && k.charge > 0.85) { for (const sd of [-1, 1]) G.parts.push({ x: k.x - fx * 12 + (-fy) * sd * 10, y: k.y - fy * 12 + fx * sd * 10, z: 3, vz: 40 + Math.random() * 40, life: 0.25, col: k.charge >= 1.7 ? '#ffb02e' : '#5ad0ff', sz: 2 }); }
    if (offroad && Math.abs(k.vel) > 60) G.parts.push({ x: k.x - fx * 14 + (Math.random() - .5) * 16, y: k.y - fy * 14 + (Math.random() - .5) * 16, z: 2, vz: 30 + Math.random() * 30, life: 0.35, col: C.th.dust, sz: 3 });
    if (k.boost > 0) G.parts.push({ x: k.x - fx * 20, y: k.y - fy * 20, z: 6, vz: 10, life: 0.15, col: Math.random() < .5 ? '#ffe14a' : '#ff6a1a', sz: 4 });
  }
  // アイテム使用
  if (inp.item && !prev.item && k.item && k.roul <= 0 && k.spin <= 0) useItem(k);
  if (k.roul > 0) {
    k.roul -= dt;
    if (k === G.player && Math.floor(k.roul * 14) !== Math.floor((k.roul + dt) * 14)) SFX.tick();
    if (k.roul <= 0) { k.item = pickItem(k.rank); if (k === G.player) SFX.get(); }
  }
}

function updateObjs(dt) {
  const C = G.C;
  for (const o of G.objs) {
    o.life -= dt; o.age = (o.age || 0) + dt;
    if (o.type === 'green' || o.type === 'red') {
      if (o.type === 'red') {
        const t = o.target;
        let aim;
        if (t && !t.finished && Math.hypot(t.x - o.x, t.y - o.y) < 260) aim = Math.atan2(t.y - o.y, t.x - o.x);
        else {
          let best = 1e18, bi = o.idx; for (let k = -6; k <= 20; k++) { const i = (o.idx + k + C.N) % C.N, d = (C.px[i] - o.x) ** 2 + (C.py[i] - o.y) ** 2; if (d < best) { best = d; bi = i; } } o.idx = bi;
          const j = (bi + 8) % C.N; aim = Math.atan2(C.py[j] - o.y, C.px[j] - o.x);
        }
        o.ang += clamp(angDiff(aim, o.ang), -6 * dt, 6 * dt);
      }
      const nx = o.x + Math.cos(o.ang) * o.sp * dt, ny = o.y + Math.sin(o.ang) * o.sp * dt;
      if (terrainAt(nx, ny) === 0) {
        if (C.def.edge === 'void') { o.life = 0; continue; }
        if (terrainAt(nx, o.y) === 0) o.ang = Math.PI - o.ang;
        if (terrainAt(o.x, ny) === 0) o.ang = -o.ang;
        o.bounces++; if (o.bounces > 6) o.life = 0;
      } else { o.x = nx; o.y = ny; }
    }
    if (o.life <= 0) continue;
    for (const k of G.karts) {
      if (k.fall > 0 || k.z > 18) continue;
      if ((o.type === 'green' || o.type === 'red') && k === o.owner && o.age < 0.5) continue;
      if (Math.hypot(k.x - o.x, k.y - o.y) < 15) { hitKart(k, o); o.life = 0; if (near(k)) SFX.bump(); break; }
    }
  }
  // 甲羅とバナナの相殺
  for (const a of G.objs) if (a.life > 0 && a.type !== 'banana') for (const b of G.objs) if (b !== a && b.life > 0 && Math.hypot(a.x - b.x, a.y - b.y) < 14) { a.life = 0; b.life = 0; }
  G.objs = G.objs.filter(o => o.life > 0);
  // ボックス・コイン
  for (const b of C.boxes) {
    if (b.t > 0) { b.t -= dt; continue; }
    for (const k of G.karts) if (k.fall <= 0 && Math.hypot(k.x - b.x, k.y - b.y) < 18) {
      b.t = 3; if (!k.item && k.roul <= 0) { k.roul = k.isPlayer ? 1.3 : 0.6; }
      if (k === G.player) SFX.box();
      for (let i = 0; i < 8; i++) G.parts.push({ x: b.x, y: b.y, z: 10, vz: 60 + Math.random() * 60, vx: (Math.random() - .5) * 120, vy: (Math.random() - .5) * 120, life: 0.4, col: `hsl(${Math.random() * 360},90%,65%)`, sz: 3 });
      break;
    }
  }
  const p = G.player;
  for (const c of C.coins) {
    if (c.t > 0) { c.t -= dt; continue; }
    if (p.fall <= 0 && Math.hypot(p.x - c.x, p.y - c.y) < 16) { c.t = 20; if (p.coins < 10) p.coins++; if (!G.demo) SFX.coin(); }
  }
  for (const q of G.parts) { q.life -= dt; q.z += q.vz * dt; q.vz -= 300 * dt; if (q.vx) { q.x += q.vx * dt; q.y += q.vy * dt; } if (q.z < 0) q.z = 0; }
  G.parts = G.parts.filter(q => q.life > 0);
  if (G.parts.length > 400) G.parts.splice(0, G.parts.length - 400);
}

function collideKarts() {
  const ks = G.karts;
  for (let i = 0; i < ks.length; i++) for (let j = i + 1; j < ks.length; j++) {
    const a = ks[i], b = ks[j]; if (a.fall > 0 || b.fall > 0 || Math.abs(a.z - b.z) > 14) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d < KR * 2 && d > 0.01) {
      if (a.star > 0 && b.star <= 0) { hitKart(b); continue; }
      if (b.star > 0 && a.star <= 0) { hitKart(a); continue; }
      const ov = KR * 2 - d, ux = dx / d, uy = dy / d, wa = a.ch.st.wt, wb = b.ch.st.wt, sum = wa + wb;
      a.x -= ux * ov * wb / sum; a.y -= uy * ov * wb / sum; b.x += ux * ov * wa / sum; b.y += uy * ov * wa / sum;
      const pa = Math.cos(a.moveAng) * ux + Math.sin(a.moveAng) * uy, pb = Math.cos(b.moveAng) * ux + Math.sin(b.moveAng) * uy;
      if (pa * a.vel - pb * b.vel > 20) { a.vel *= 1 - 0.25 * wb / sum; b.vel *= 1 - 0.1 * wa / sum; if (a === G.player || b === G.player) SFX.bump(); }
    }
  }
}

function computeRanks() {
  const ks = [...G.karts].sort((a, b) => (b.finished - a.finished) || (a.finished && b.finished ? a.finT - b.finT : b.progress - a.progress));
  ks.forEach((k, i) => k.rank = i + 1);
}

function step(dt) {
  G.t += dt;
  const pinp = readInput();
  if (G.state === 'count') {
    const before = G.count; G.count -= dt;
    if (pinp.accel && G.startPress < 0) G.startPress = G.count;
    if (!pinp.accel) G.startPress = -1;
    const n = Math.ceil(G.count);
    if (Math.ceil(before) !== n && n <= 3 && n >= 1) { setSignal(4 - n); SFX.beep(); }
    if (G.count <= 0) {
      G.state = 'race'; setSignal(4); SFX.go(); showMsg('GO!', 1); music(true, G.C.def.music, 1);
      const p = G.player;
      if (pinp.accel && G.startPress >= 0 && G.startPress < 0.7) { p.boost = 1.0; p.boostLv = 2; SFX.boost(); }
      else if (pinp.accel && G.startPress > 1.6) { p.spin = 0.8; showMsg('エンスト…', 1); }
      for (const k of G.karts) if (!k.isPlayer && Math.random() < 0.5) { k.boost = 0.6 + Math.random() * 0.4; k.boostLv = 1; }
    }
  } else if (G.state === 'race' || G.state === 'finish' || G.state === 'title') G.raceT += dt;
  if (G.state === 'finish') { G.finT += dt; if (G.finT > 4 && G.state === 'finish') showResults(); }
  if (G.msgT > 0) { G.msgT -= dt; if (G.msgT <= 0) $('msg').innerHTML = ''; }
  if (G.state === 'count' && G.count < -0.0) { }
  if (!$('signal').hidden && G.state === 'race' && G.raceT > 1.2) $('signal').hidden = true;

  for (const k of G.karts) {
    const human = k.isPlayer && G.state !== 'finish';
    const inp = human ? pinp : aiInput(k);
    const prev = k.prevInp || {};
    updateKart(k, inp, dt, prev);
    k.prevInp = inp;
    updateIdx(k);
  }
  collideKarts();
  updateObjs(dt);
  computeRanks();
  // カメラ
  const p = G.player, cam = G.cam;
  if (p.fall <= 0) {
    const target = p.moveAng + angDiff(p.ang, p.moveAng) * 0.45;
    cam.ang += angDiff(target, cam.ang) * Math.min(1, 7 * dt);
    cam.x = p.x - Math.cos(cam.ang) * CAM_DIST; cam.y = p.y - Math.sin(cam.ang) * CAM_DIST;
  }
  if (G.demo && Math.random() < 0.002) { /* デモ中に時々カメラ対象を変える */ G.player = G.karts[(Math.random() * 8) | 0]; }
  // エンジン音
  if (AU.engGain) {
    const on = !G.demo && (G.state === 'race' || G.state === 'count' || G.state === 'finish');
    AU.engGain.gain.setTargetAtTime(on ? 0.05 : 0, AU.ctx.currentTime, 0.05);
    AU.engine.frequency.setTargetAtTime(45 + Math.abs(p.vel) * 0.32 + (p.boost > 0 ? 25 : 0), AU.ctx.currentTime, 0.05);
  }
}

// ---------------- レンダリング ----------------
const cv = $('screen'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const img = ctx.createImageData(W, H), buf = new Uint32Array(img.data.buffer);

function render() {
  const C = G.C, cam = G.cam, ca = Math.cos(cam.ang), sa = Math.sin(cam.ang), rx = -sa, ry = ca;
  // 空
  let ox = ((cam.ang / (2 * Math.PI)) * BGW) % BGW; if (ox < 0) ox += BGW;
  ctx.drawImage(C.bg, -ox, 0); ctx.drawImage(C.bg, -ox + BGW, 0);
  // 地面 (モード7)
  const tex = C.tex;
  for (let sy = HOR + 1; sy < H; sy++) {
    const dist = cam.h * FOCAL / (sy - HOR), k = dist / FOCAL;
    let wx = cam.x + ca * dist - rx * k * (W / 2), wy = cam.y + sa * dist - ry * k * (W / 2);
    const dx = rx * k, dy = ry * k;
    let o = sy * W;
    for (let sx = 0; sx < W; sx++) { buf[o++] = tex[((wy | 0) & MASK) * MAP + ((wx | 0) & MASK)]; wx += dx; wy += dy; }
  }
  ctx.putImageData(img, 0, 0, 0, HOR + 1, W, H - HOR - 1);
  const fg = ctx.createLinearGradient(0, HOR, 0, HOR + 30); fg.addColorStop(0, C.th.fog); fg.addColorStop(1, C.th.fog + '00');
  ctx.globalAlpha = 0.75; ctx.fillStyle = fg; ctx.fillRect(0, HOR, W, 30); ctx.globalAlpha = 1;

  // スプライト
  const proj = (x, y, z) => {
    const dx = x - cam.x, dy = y - cam.y, depth = dx * ca + dy * sa; if (depth < 20 || depth > 2600) return null;
    const side = dx * rx + dy * ry, s = FOCAL / depth, sx = W / 2 + side * s;
    if (sx < -80 || sx > W + 80) return null;
    return { x: sx, y: HOR + (cam.h - z) * s, gy: HOR + cam.h * s, s, depth };
  };
  const list = [];
  const shadow = (p, r) => { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(p.x, p.gy, r * p.s, r * 0.38 * p.s, 0, 0, 7); ctx.fill(); };
  for (const b of C.boxes) {
    if (b.t > 0) continue; const z = 9 + Math.sin(G.t * 3 + b.x) * 2, p = proj(b.x, b.y, z); if (!p) continue;
    list.push({ d: p.depth, f: () => {
      shadow(p, 8); const r = 8 * p.s;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.sin(G.t * 2 + b.y) * 0.25);
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-r, -r, 2 * r, 2 * r);
      ctx.lineWidth = Math.max(1, r * 0.22); ctx.strokeStyle = `hsl(${(G.t * 200 + b.x) % 360},95%,60%)`; ctx.strokeRect(-r, -r, 2 * r, 2 * r);
      if (r > 4) { ctx.fillStyle = '#fff'; ctx.font = `${Math.round(r * 1.5)}px monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', 0, r * 0.08); }
      ctx.restore();
    } });
  }
  for (const c of C.coins) {
    if (c.t > 0) continue; const p = proj(c.x, c.y, 7); if (!p) continue;
    list.push({ d: p.depth, f: () => {
      shadow(p, 4); const w = Math.max(1, 4 * p.s * Math.abs(Math.cos(G.t * 4 + c.x))), h = 5 * p.s;
      ctx.fillStyle = '#c98a00'; ctx.beginPath(); ctx.ellipse(p.x, p.y, w + 0.6, h + 0.6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffd21f'; ctx.beginPath(); ctx.ellipse(p.x, p.y, w, h, 0, 0, 7); ctx.fill();
      if (w > 2) { ctx.fillStyle = '#fff6b0'; ctx.fillRect(p.x - w * 0.25, p.y - h * 0.5, Math.max(1, w * 0.3), h); }
    } });
  }
  for (const o of G.objs) {
    const p = proj(o.x, o.y, 5); if (!p) continue;
    list.push({ d: p.depth, f: () => { shadow(p, 6); drawItemIcon(ctx, o.type, p.x, p.y, 6 * p.s, G.t); } });
  }
  for (const k of G.karts) {
    const p = proj(k.x, k.y, Math.max(0, k.z)); if (!p) continue;
    list.push({ d: p.depth, f: () => {
      let s = p.s, y = p.y;
      if (k.fall > 0) { const f = clamp(k.fall / 1.3, 0, 1); s *= 0.3 + 0.7 * f; y = p.gy + (1 - f) * 20 * p.s; ctx.globalAlpha = f; }
      else shadow(p, 15);
      if (k.safe > 0 && Math.floor(G.t * 20) % 2) ctx.globalAlpha = 0.4;
      const yaw = k.ang + k.spinRot - cam.ang + (k.drift ? k.drift * 0.25 : 0);
      drawKart(ctx, p.x, y, s, yaw, k.ch, { star: k.star > 0, t: G.t });
      ctx.globalAlpha = 1;
      if (k.roul > 0 || (k.item && k !== G.player && p.s > 1.2)) { }
      if (!G.demo && k !== G.player && p.depth < 900) {
        ctx.font = '8px monospace'; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(k.rank, p.x + 1, y - 34 * s + 1); ctx.fillStyle = '#fff'; ctx.fillText(k.rank, p.x, y - 34 * s);
      }
    } });
  }
  for (const q of G.parts) {
    const p = proj(q.x, q.y, q.z); if (!p) continue;
    list.push({ d: p.depth - 1, f: () => { ctx.fillStyle = q.col; const sz = Math.max(1, q.sz * p.s * 0.6); ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz); } });
  }
  list.sort((a, b) => b.d - a.d);
  for (const it of list) it.f();
  // スター/ブースト時の画面エフェクト
  const pl = G.player;
  if (pl.boost > 0 && !G.demo) {
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) { const a = Math.random() * Math.PI * 2, r1 = 90 + Math.random() * 40; ctx.beginPath(); ctx.moveTo(W / 2 + Math.cos(a) * r1, H * 0.6 + Math.sin(a) * r1 * 0.6); ctx.lineTo(W / 2 + Math.cos(a) * (r1 + 40), H * 0.6 + Math.sin(a) * (r1 + 40) * 0.6); ctx.stroke(); }
  }
}

  const C = G.C;
  for (const k of G.karts) if (!k.finished) { const remain = (LAPS * C.N - k.progress) * C.sl; k.finT = G.raceT + remain / (CC[G.cc].base * 0.9); k.finished = true; }
  const ord = [...G.karts].sort((a, b) => a.finT - b.finT); ord.forEach((k, i) => k.rank = i + 1);
  let html = '';
  const p = G.player;
  if (G.mode === 'gp') {
    ord.forEach((k, i) => G.gp[k.ch.id] += POINTS[i]);
    html = `<h2>グランプリ 第${G.gpRace + 1}戦 結果</h2><table class="res"><tr><th>順位</th><th>ドライバー</th><th>タイム</th><th class="n">+pt</th><th class="n">合計</th></tr>${ord.map((k, i) => `<tr class="${k === p ? 'me' : ''}"><td>${i + 1}${rankStr(i + 1)}</td><td><span class="dot" style="background:${k.ch.body}"></span>${k.ch.name}</td><td>${fmtTime(k.finT)}</td><td class="n">${POINTS[i] ? '+' + POINTS[i] : ''}</td><td class="n">${G.gp[k.ch.id]}</td></tr>`).join('')}</table>
    <div class="row"><button class="opt" data-a="${G.gpRace < COURSES.length - 1 ? 'next' : 'gpend'}" type="button">${G.gpRace < COURSES.length - 1 ? '次のレースへ' : '最終結果へ'}</button><button class="opt" data-a="quit" type="button">タイトルへ</button></div>`;
  } else {
    html = `<h2>${C.def.name} 結果</h2><table class="res"><tr><th>順位</th><th>ドライバー</th><th>タイム</th></tr>${ord.map((k, i) => `<tr class="${k === p ? 'me' : ''}"><td>${i + 1}${rankStr(i + 1)}</td><td><span class="dot" style="background:${k.ch.body}"></span>${k.ch.name}</td><td>${fmtTime(k.finT)}</td></tr>`).join('')}</table>
    <div class="help">ベストラップ ${fmtTime(p.bestLap)}</div>
    <div class="row"><button class="opt" data-a="retry" type="button">もう一度</button><button class="opt" data-a="free" type="button">コースをえらぶ</button><button class="opt" data-a="quit" type="button">タイトルへ</button></div>`;
  }
  $('msg').innerHTML = ''; G.msgT = 0;
  setMenu(html, true);
}
function showGPEnd() {
  menuStep = 'gpend';
  const ord = CHARS.map(c => c).sort((a, b) => G.gp[b.id] - G.gp[a.id]);
  const myRank = ord.findIndex(c => c.id === G.pchar) + 1;
  const tro = myRank === 1 ? '🏆 ゴールドカップ！' : myRank === 2 ? 'シルバーカップ' : myRank === 3 ? 'ブロンズカップ' : 'また挑戦しよう！';
  setMenu(`<h2>グランプリ 最終結果 (${CC[G.cc].name})</h2><div class="trophy">${myRank}${rankStr(myRank)} — ${tro}</div>
    <table class="res"><tr><th>順位</th><th>ドライバー</th><th class="n">ポイント</th></tr>${ord.map((c, i) => `<tr class="${c.id === G.pchar ? 'me' : ''}"><td>${i + 1}${rankStr(i + 1)}</td><td><span class="dot" style="background:${c.body}"></span>${c.name}</td><td class="n">${G.gp[c.id]}</td></tr>`).join('')}</table>
    <div class="row"><button class="opt" data-a="quit" type="button">タイトルへ</button></div>`, true);
  if (myRank <= 3) SFX.finish();
}

let pendingCourse = 0;
function beginRace(ci) { pendingCourse = ci; hideMenu(); startRace(ci, false); }
function menuAction(a, v) {
  audioInit();
  switch (a) {
    case 'start': showMode(); break;
    case 'gp': G.mode = 'gp'; showCC(); break;
    case 'free': G.mode = 'free'; if (menuStep === 'results') showCourses(); else showCC(); break;
    case 'cc': G.cc = +v; showChars(); break;
    case 'char': G.pchar = +v; if (G.mode === 'gp') { G.gpRace = 0; G.gp = CHARS.map(() => 0); beginRace(0); } else showCourses(); break;
    case 'course': beginRace(+v); break;
    case 'resume': hideMenu(); G.state = G.player.finished ? 'finish' : (G.count > 0 ? 'count' : 'race'); if (G.state !== 'count') music(true, G.C.def.music, G.final ? 1.15 : 1); break;
    case 'retry': if (G.mode === 'gp' && menuStep === 'pause') { /* GPのやりなおしはポイント据え置き */ } beginRace(G.C.ci); break;
    case 'next': G.gpRace++; beginRace(G.gpRace); break;
    case 'gpend': showGPEnd(); break;
    case 'quit': music(false); G.demo = false; showTitle(); music(true, 0, 1); break;
  }
}
menu.addEventListener('click', e => { const b = e.target.closest('.opt'); if (b) menuAction(b.dataset.a, b.dataset.v); });
function menuBack() {
  const back = { mode: showTitle, cc: showMode, char: showCC, course: showChars };
  if (back[menuStep]) back[menuStep]();
}
function onPress(code) {
  if (code === 'KeyM') { setMuted(!AU.muted); return; }
  const inMenu = !menu.hidden;
  if (inMenu) {
    const opts = [...menu.querySelectorAll('.opt')]; if (!opts.length) return;
    let i = opts.indexOf(document.activeElement);
    const cols = menu.querySelector('.chars,.courses') ? 4 : opts.length;
    const mv = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols < opts.length ? cols : 1, ArrowUp: cols < opts.length ? -cols : -1 }[code];
    if (mv) { i = i < 0 ? 0 : clamp(i + mv, 0, opts.length - 1); opts[i].focus({ preventScroll: true }); return; }
    if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') { (i >= 0 ? opts[i] : opts[0]).click(); return; }
    if (code === 'Escape' || code === 'Backspace') { if (menuStep === 'pause') menuAction('resume'); else menuBack(); }
    return;
  }
  if ((code === 'Escape' || code === 'KeyP') && (G.state === 'race' || G.state === 'count' || G.state === 'finish')) showPause();
}
// タッチ端末でのポーズ
$('wrap').addEventListener('click', e => { if (isTouch && menu.hidden && e.target === cv && (G.state === 'race' || G.state === 'finish')) showPause(); });

// ---------------- メインループ ----------------
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  const DT = 1 / 60;
  const running = G.state !== 'pause' && G.state !== 'results' && !(menuStep === 'gpend');
  while (acc >= DT) { if (running) step(DT); else readInput(); acc -= DT; }
  render(); drawHUD();
  for (const pv of previews) {
    const g = pv.g; g.clearRect(0, 0, 96, 48);
    g.fillStyle = pv.btn === document.activeElement ? '#3a3380' : '#241f55'; g.fillRect(0, 0, 96, 48);
    g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(48, 41, 24, 6, 0, 0, 7); g.fill();
    drawKart(g, 48, 41, 1.3, G.t * 1.2 + pv.ch.id, pv.ch, {});
  }
}
showTitle();
requestAnimationFrame(frame);
</script>
</body>
