<title>レース実況ビュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
  /* レイアウト: 中継画面。左にコース俯瞰と実況テロップ、右に順位ボード (狭い画面では縦積み) */
  :root {
    color-scheme: dark;
    --bg: #0d1610;        /* 夜の内馬場 */
    --panel: #142019;
    --panel-2: #1b2a20;
    --line: #2a3d30;
    --text: #eef3ec;
    --muted: #9fb1a3;
    --accent: #ffcc33;    /* 中継テロップの金 */
    --turf: #3b8a46;
    --turf-in: #255a2d;
    --dirt: #a57d55;
    --rail: #f3f3ee;
    --ground: #17291c;
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
    --font-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 12px;
    padding-block: 12px; padding-inline: 16px; }
  @media (max-width: 760px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
  .head { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; }
  .head h1 { font-size: 18px; margin: 0; letter-spacing: .02em; text-wrap: balance; font-weight: 700; }
  .badge { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--panel-2);
    color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  .badge.mode { color: var(--accent); border-color: var(--accent); }
  #raceSel { margin-left: auto; max-width: 100%; }
  .stage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; min-width: 0; }
  canvas { display: block; width: 100%; height: 360px; }
  .hud { position: absolute; top: 8px; left: 10px; display: flex; gap: 6px; font-family: var(--font-num);
    font-variant-numeric: tabular-nums; }
  .hud span { background: rgba(0,0,0,.6); padding: 2px 9px; border-radius: 5px; font-size: 17px; letter-spacing: .03em; }
  .hud #remain { color: var(--accent); }
  .telop { min-height: 58px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--bg);
    font-size: 16px; line-height: 1.55; display: flex; align-items: center; gap: 10px; font-weight: 500; }
  .telop .mic { color: var(--bg); background: var(--accent); font-weight: 700; font-size: 11px; letter-spacing: .12em;
    border-radius: 3px; padding: 2px 7px; flex: none; }
  .telop .txt { transition: opacity .25s; min-width: 0; }
  .controls { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line);
    flex-wrap: wrap; }
  button, select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--muted); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
  label.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .note { font-size: 11px; color: var(--muted); margin-left: auto; }
  .board { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px;
    display: flex; flex-direction: column; min-width: 0; }
  .board h2 { font-size: 12px; margin: 2px 4px 8px; color: var(--muted); font-weight: 700; letter-spacing: .12em; }
  .rows { position: relative; flex: 1; }
  .row { position: absolute; left: 0; right: 0; height: 26px; display: flex; align-items: center; gap: 6px;
    padding: 0 4px; font-size: 12.5px; transition: top .35s ease; border-radius: 4px; }
  .row.hl { background: rgba(255, 204, 51, .12); }
  .pos { width: 18px; text-align: right; color: var(--muted); font-family: var(--font-num); font-size: 15px;
    font-variant-numeric: tabular-nums; }
  .num { width: 22px; height: 20px; border-radius: 4px; display: grid; place-items: center; font-weight: 700;
    font-size: 13px; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); font-family: var(--font-num); }
  .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mark { width: 14px; color: var(--accent); font-weight: 700; }
  .gap { width: 64px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px; }
  .result { position: absolute; inset: 0; background: rgba(5, 12, 7, .82); display: none; align-items: center;
    justify-content: center; padding: 12px; }
  .result.show { display: flex; }
  .result .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px;
    min-width: 0; width: min(380px, 100%); }
  .result h3 { margin: 0 0 8px; font-size: 15px; }
  .result table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .result td { padding: 4px 6px; border-top: 1px solid var(--line); }
  .result td.r { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .result .hit { margin-top: 8px; color: var(--accent); font-weight: 700; font-size: 13px; }
  .result .close { margin-top: 10px; font-size: 11px; color: var(--muted); }
  .start { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(5, 12, 7, .45); }
  .start[hidden] { display: none; }
  .start button { font-size: 18px; padding: 12px 28px; }
  @media (prefers-reduced-motion: reduce) { .row, .telop .txt { transition: none; } }
</style>

<div class="wrap">
  <div class="head">
    <h1 id="title"></h1>
    <span class="badge mode" id="mode"></span>
    <span class="badge" id="dir"></span>
    <select id="raceSel" aria-label="レースを選ぶ" hidden></select>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud"><span id="clock">0:00.0</span><span id="remain"></span></div>
    <div class="start" id="startOverlay"><button class="primary" id="startBtn">▶ スタート</button></div>
    <div class="result" id="result"><div class="card" id="resultCard"></div></div>
    <div class="telop"><span class="mic">実況</span><span class="txt" id="telop">ゲートインが完了しました。</span></div>
    <div class="controls">
      <button id="playBtn">▶ 再生</button>
      <button id="resetBtn">⟲ 最初から</button>
      <select id="speed" aria-label="再生速度">
        <option value="1">等速</option><option value="2" selected>2倍速</option><option value="4">4倍速</option>
      </select>
      <label class="toggle"><input type="checkbox" id="voice"> 実況を読み上げる</label>
      <span class="note" id="note"></span>
    </div>
  </div>
  <div class="board">
    <h2>現在の順位</h2>
    <div class="rows" id="rows"></div>
  </div>
</div>

<script>
const DATA = __RACE_DATA__;
const RACES = Array.isArray(DATA) ? DATA : [DATA];
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const COLOR = {
  ground: css("--ground"), turf: css("--turf"), turfIn: css("--turf-in"), dirt: css("--dirt"),
  rail: css("--rail"), accent: css("--accent"), muted: css("--muted"),
};
const NUM_FONT = "'Barlow Condensed', 'Arial Narrow', sans-serif";

// ------------------------------------------------------------ 表示中のレース
let RACE, H, N, D, DT, P, FRAMES, DIRT, winT, rowEls = [], lateral = [];

const marginText = (m) => {
  const l = m / 2.4;
  if (l < 0.15) return "ハナ"; if (l < 0.3) return "アタマ"; if (l < 0.45) return "クビ";
  if (l < 0.65) return "1/2馬身"; if (l < 0.85) return "3/4馬身"; if (l >= 10) return "大差";
  const whole = Math.floor(l + 0.25);
  return whole + (l - whole >= 0.25 ? "½" : "") + "馬身";
};
const modeLabel = (r) => r.mode === "replay" ? "結果リプレイ" : "予想シミュレーション";

// ------------------------------------------------------------ コース形状
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const LANES = 5;
const C_M = 1900;                 // コース 1 周の長さ (m, 表示用の共通値)
let G = null;                     // 描画用のジオメトリ (px)

function layout() {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth;
  const h = Math.round(Math.min(380, Math.max(230, w * 0.56)));
  cv.style.height = h + "px";
  cv.width = w * dpr; cv.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const k = Math.min(1, Math.max(0.62, w / 760));       // 狭い画面では馬とレーンを小さく
  const rh = 9 * k, lane = 2 * rh + 2, band = LANES * lane + 8;
  const R = Math.max(24, (h - 40 - 2 * band) / 2);
  const Ls = Math.max(40, w - 24 - 2 * (R + band));
  G = { w, h, k, rh, lane, band, R, Ls, cx: w / 2, cy: h / 2 + 8, L: 2 * Ls + 2 * Math.PI * R };
}

// u: 内ラチ沿い 0..L (px) の位置, off: 外側への距離 (px)
// 左回り基準: 下の直線 (ホームストレッチ) を左→右に走る。右回りは左右反転。
function pointAt(u, off) {
  const { Ls, R, L } = G;
  u = ((u % L) + L) % L;
  let x, y;
  const r = R + off;
  if (u < Ls) { x = -Ls / 2 + u; y = r; }
  else if (u < Ls + Math.PI * R) {
    const a = Math.PI / 2 - (u - Ls) / R; x = Ls / 2 + r * Math.cos(a); y = r * Math.sin(a);
  } else if (u < 2 * Ls + Math.PI * R) { x = Ls / 2 - (u - Ls - Math.PI * R); y = -r; }
  else {
    const a = -Math.PI / 2 - (u - 2 * Ls - Math.PI * R) / R; x = -Ls / 2 + r * Math.cos(a); y = r * Math.sin(a);
  }
  if (!RACE.left_handed) x = -x;
  return [G.cx + x, G.cy + y];
}
// 走行距離 (m) → コース上の位置 u (px). ゴールはホームストレッチの 85% 地点
const finishU = () => G.Ls * 0.85;
const uOf = (meters) => finishU() - (D - meters) / C_M * G.L;

function tracePath(off) {
  ctx.beginPath();
  for (let k = 0; k <= 240; k++) {
    const [x, y] = pointAt(G.L * k / 240, off);
    k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

function drawTrack() {
  const { w, h, band } = G;
  ctx.fillStyle = COLOR.ground; ctx.fillRect(0, 0, w, h);
  tracePath(band / 2 - 4); ctx.lineWidth = band; ctx.strokeStyle = DIRT ? COLOR.dirt : COLOR.turf; ctx.stroke();
  tracePath(-6); ctx.fillStyle = COLOR.turfIn; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = COLOR.rail;
  tracePath(-4); ctx.stroke(); tracePath(band - 4); ctx.stroke();
  // 残り距離の標識
  ctx.font = `${Math.round(11 * G.k + 1)}px ${NUM_FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const m of [1000, 800, 600, 400, 200]) {
    if (m >= D) continue;
    const [x, y] = pointAt(uOf(D - m), -14);
    ctx.fillStyle = COLOR.rail; ctx.fillText(String(m), x, y);
  }
  // ゴール板
  const [gx1, gy1] = pointAt(finishU(), -6), [gx2, gy2] = pointAt(finishU(), band - 2);
  ctx.strokeStyle = COLOR.accent; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(gx1, gy1); ctx.lineTo(gx2, gy2); ctx.stroke();
  const [lx, ly] = pointAt(finishU(), -18);
  ctx.fillStyle = COLOR.accent; ctx.font = `bold ${Math.round(12 * G.k)}px sans-serif`; ctx.fillText("ゴール", lx, ly);
  // スタート地点
  let [sx, sy] = pointAt(uOf(0), band + 9);
  sx = Math.min(Math.max(sx, 28), w - 28); sy = Math.min(Math.max(sy, 10), h - 8);
  ctx.fillStyle = COLOR.muted; ctx.font = `${Math.round(11 * G.k)}px sans-serif`; ctx.fillText("スタート", sx, sy);
}

// ------------------------------------------------------------ 再生状態
let simT = 0, playing = false, lastTs = null, nextEvent = 0, resultShown = false;
const posAt = (i, t) => {
  const f = Math.min(t / DT, FRAMES - 1), k = Math.floor(f), a = f - k;
  return k + 1 < FRAMES ? P[i][k] * (1 - a) + P[i][k + 1] * a : P[i][k];
};

function updateLanes(dist) {
  const order = [...dist.keys()].sort((a, b) => dist[b] - dist[a]);
  // 前方 7m 以内にいる馬と重ならないよう、空いている一番内のレーンに入る
  const placed = [], laneOf = {};
  for (const i of order) {
    const busy = new Set(placed.filter(j => dist[j] - dist[i] < 7).map(j => laneOf[j]));
    let lane = 0; while (busy.has(lane) && lane < LANES - 1) lane++;
    placed.push(i); laneOf[i] = lane;
    const target = G.rh + 4 + lane * G.lane;
    lateral[i] += (target - lateral[i]) * 0.12;
  }
  return order;
}

function drawHorses(dist, order) {
  const rh = G.rh;
  for (const i of [...order].reverse()) {          // 後ろの馬から描いて先頭を上に
    const [x, y] = pointAt(uOf(Math.max(dist[i], 0)), lateral[i]);
    const h = H[i];
    if (h.mark) {
      ctx.beginPath(); ctx.arc(x, y, rh + 3, 0, Math.PI * 2);
      ctx.strokeStyle = COLOR.accent; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x, y, rh, 0, Math.PI * 2);
    ctx.fillStyle = h.bg; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.stroke();
    ctx.fillStyle = h.fg; ctx.font = `600 ${Math.round(12 * G.k)}px ${NUM_FONT}`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(String(h.num), x, y + 0.5);
  }
}

// ------------------------------------------------------------ 順位ボード
const rowsEl = document.getElementById("rows");
function buildBoard() {
  rowsEl.innerHTML = "";
  rowEls = H.map(h => {
    const el = document.createElement("div");
    el.className = "row" + (h.mark === "◎" || h.stake > 0 ? " hl" : "");
    const name = h.name.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    el.innerHTML = `<span class="pos"></span><span class="num" style="background:${h.bg};color:${h.fg}">${h.num}</span>
      <span class="mark">${h.mark}</span><span class="name" title="${name} (${h.style})">${name}</span><span class="gap"></span>`;
    rowsEl.appendChild(el); return el;
  });
  rowsEl.style.minHeight = (N * 27) + "px";
}
function updateBoard(dist) {
  // ゴールした馬は着順 (タイム順) で固定し、走行中の馬はその後ろに距離順で並べる
  const done = (i) => dist[i] >= D;
  const order = [...dist.keys()].sort((a, b) =>
    done(a) && done(b) ? H[a].time - H[b].time : done(a) ? -1 : done(b) ? 1 : dist[b] - dist[a]);
  const lead = Math.min(dist[order[0]], D);
  order.forEach((i, r) => {
    const el = rowEls[i];
    el.style.top = (r * 27) + "px";
    el.querySelector(".pos").textContent = r + 1;
    const behind = done(i) ? (H[i].time - H[order[0]].time) * D / H[order[0]].time : lead - Math.min(dist[i], D);
    el.querySelector(".gap").textContent = r === 0 ? H[i].style : marginText(behind);
  });
}

// ------------------------------------------------------------ 実況
const telop = document.getElementById("telop");
const voice = document.getElementById("voice");
const speed = () => Number(document.getElementById("speed").value);
function say(text) {
  telop.style.opacity = 0;
  setTimeout(() => { telop.textContent = text; telop.style.opacity = 1; }, 120);
  if (voice.checked && "speechSynthesis" in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = Math.min(1.1 + 0.15 * speed(), 1.8);
    speechSynthesis.speak(u);
  }
}

// ------------------------------------------------------------ 結果
const resultEl = document.getElementById("result");
function showResult() {
  const fin = [...H.keys()].sort((a, b) => H[a].time - H[b].time);
  const t0 = H[fin[0]].time;
  const fmt = (s) => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`;
  const rows = fin.slice(0, 5).map((i, r) => {
    const h = H[i];
    const diff = r === 0 ? fmt(h.time) : marginText((h.time - H[fin[r - 1]].time) * D / t0);
    return `<tr><td>${r + 1}着</td><td><span class="num" style="display:inline-grid;background:${h.bg};color:${h.fg}">${h.num}</span></td>
      <td>${h.mark} ${rowEls[i].querySelector(".name").innerHTML}</td><td class="r">${diff}</td></tr>`;
  }).join("");
  const w = H[fin[0]];
  let hit = "";
  const bets = H.filter(h => h.stake > 0);
  if (bets.length) {
    hit = w.stake > 0
      ? `推奨馬券 的中！ 単勝 ${w.num}番 ${w.stake.toLocaleString()}円 → 払戻 ${Math.round(w.stake * w.odds).toLocaleString()}円`
      : `推奨馬券 (単勝 ${bets.map(b => b.num + "番").join("・")}) は不的中`;
  }
  const label = RACE.mode === "replay" ? "確定着順" : "シミュレーション結果";
  document.getElementById("resultCard").innerHTML =
    `<h3>${label}</h3><table>${rows}</table>${hit ? `<div class="hit">${hit}</div>` : ""}
     <div class="close">タップで閉じる</div>`;
  resultEl.classList.add("show");
}

// ------------------------------------------------------------ ループ
const clockEl = document.getElementById("clock"), remainEl = document.getElementById("remain");
function render() {
  const dist = H.map((_, i) => posAt(i, simT));
  const order = updateLanes(dist);
  drawTrack(); drawHorses(dist, order); updateBoard(dist);
  const s = Math.min(simT, winT);
  clockEl.textContent = `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, "0")}`;
  const remain = Math.max(0, D - dist[order[0]]);
  remainEl.textContent = remain > 0 ? `残り ${Math.ceil(remain / 10) * 10}m` : "ゴール";
}

function tick(ts) {
  if (playing) {
    if (lastTs !== null) simT += (ts - lastTs) / 1000 * speed();
    lastTs = ts;
    while (nextEvent < RACE.events.length && RACE.events[nextEvent].t <= simT) say(RACE.events[nextEvent++].text);
    if (simT >= winT + 2.5 && !resultShown) { resultShown = true; showResult(); }
    if (simT >= (FRAMES - 1) * DT) { simT = (FRAMES - 1) * DT; setPlaying(false); }
  }
  render();
  requestAnimationFrame(tick);
}

const playBtn = document.getElementById("playBtn");
const startOverlay = document.getElementById("startOverlay");
function setPlaying(p) {
  playing = p; lastTs = null;
  playBtn.textContent = p ? "⏸ 一時停止" : "▶ 再生";
  if (!p && "speechSynthesis" in window) speechSynthesis.cancel();
}
function restart(autoplay) {
  simT = 0; nextEvent = 0; resultShown = false;
  resultEl.classList.remove("show");
  telop.textContent = "ゲートインが完了しました。";
  lateral = new Array(N).fill(G.rh + 4);
  setPlaying(autoplay);
}
playBtn.onclick = () => { startOverlay.hidden = true; setPlaying(!playing); };
document.getElementById("resetBtn").onclick = () => { startOverlay.hidden = true; restart(true); };
resultEl.onclick = () => resultEl.classList.remove("show");
document.getElementById("startBtn").onclick = () => { startOverlay.hidden = true; setPlaying(true); };

function load(idx) {
  RACE = RACES[idx];
  H = RACE.horses; N = H.length; D = RACE.distance; DT = RACE.dt; P = RACE.positions; FRAMES = P[0].length;
  DIRT = RACE.title.includes("ダート");
  winT = Math.min(...H.map(h => h.time));
  document.getElementById("title").textContent = RACE.title;
  document.getElementById("mode").textContent = modeLabel(RACE);
  document.getElementById("dir").textContent = RACE.left_handed ? "左回り" : "右回り";
  document.getElementById("note").textContent = RACE.note;
  buildBoard();
  startOverlay.hidden = false;
  restart(false);
}

const raceSel = document.getElementById("raceSel");
if (RACES.length > 1) {
  RACES.forEach((r, i) => raceSel.add(new Option(`${r.title}・${modeLabel(r)}`, i)));
  raceSel.hidden = false;
  raceSel.onchange = () => load(Number(raceSel.value));
}

window.addEventListener("resize", layout);
layout();
load(0);
requestAnimationFrame(tick);
</script>
