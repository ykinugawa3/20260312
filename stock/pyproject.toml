[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kabu"
version = "0.1.0"
description = "銘柄間の相対順位を予測する米国株の投資判断支援ソフト"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
fetch = ["yfinance>=0.2.40", "lxml>=4.9", "exchange_calendars>=4.5"]

[project.scripts]
kabu = "kabu.cli:main"

[tool.setuptools]
packages = ["kabu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
