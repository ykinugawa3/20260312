[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keiba"
version = "0.1.0"
description = "期待値ベースの競馬予想支援ソフト (Phase 1: 単勝勝率予測)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
keiba = "keiba.cli:main"

[tool.setuptools]
packages = ["keiba"]

[tool.pytest.ini_options]
testpaths = ["tests"]
